[package]
name = "datiolabs-core"
version = "1.0.0"
edition = "2024"

[dependencies]
bincode = "1.3"
chrono = "0.4.44"
rand = "0.10.0"
rust_decimal = { version = "1.40.0", features = ["maths", "serde", "serde-with-str"] }
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
sled = "0.34.7"
thiserror = "2.0.18"
uuid = { version = "1.22.0", features = ["v4"] }
[dev-dependencies]
serde_json = "1.0.149"
proptest = "1.4.0"
bincode = "1.3"
