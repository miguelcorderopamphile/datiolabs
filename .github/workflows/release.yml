name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned: an installer for a core tag must be reproducible. Bump the tag
      # when the frontend changes.
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: miguelcorderopamphile/datiolabs-frontend
          ref: v1.0.0
          path: ui

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build frontend
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      - name: Build installer
        working-directory: datiolabs-ui
        run: tauri build --target x86_64-pc-windows-msvc

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: target/**/release/bundle/nsis/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
